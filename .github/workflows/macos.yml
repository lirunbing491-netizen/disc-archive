name: Mac native build and tests
on:
  push:
    branches: [feature/macos-universal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-15, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and exercise packaged native components
        run: bash macos/build.sh ${{ matrix.arch }} "$RUNNER_TEMP/native-build"
      - name: Preserve executable permissions
        run: tar -czf "$RUNNER_TEMP/slice-${{ matrix.arch }}.tgz" -C "$RUNNER_TEMP/native-build" DiscArchive.app
      - uses: actions/upload-artifact@v4
        with:
          name: slice-${{ matrix.arch }}
          path: ${{ runner.temp }}/slice-${{ matrix.arch }}.tgz
          compression-level: 0
          retention-days: 7
  universal:
    needs: native
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: slice-*
          merge-multiple: true
          path: ${{ runner.temp }}/slices
      - name: Combine and verify both architectures
        run: |
          for arch in x64 arm64; do
            mkdir -p "$RUNNER_TEMP/$arch"
            tar -xzf "$RUNNER_TEMP/slices/slice-$arch.tgz" -C "$RUNNER_TEMP/$arch"
          done
          bash macos/combine.sh "$RUNNER_TEMP/x64/DiscArchive.app" "$RUNNER_TEMP/arm64/DiscArchive.app" "$RUNNER_TEMP/universal"
      - uses: actions/upload-artifact@v4
        with:
          name: DiscArchive-macOS-Universal
          path: |
            ${{ runner.temp }}/universal/DiscArchive-macOS-Universal.zip
            ${{ runner.temp }}/universal/SHA256.txt
          compression-level: 0
          retention-days: 14
